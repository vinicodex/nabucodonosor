[project]
name = "nabucodonosor"
version = "0.1.0"
description = "Production-grade RAG system to answer questions about Marcos Vinicius's professional background"
requires-python = ">=3.12"
dependencies = [
    # Vector store
    "chromadb>=0.6.0",
    # Local LLM inference
    "ollama>=0.4.0",
    # API layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # UI
    "streamlit>=1.40.0",
    "gradio>=5.9.1",
    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Cache (async SQLite)
    "aiosqlite>=0.20.0",
    # Evaluation
    "ragas>=0.2.0",
    # HTTP client
    "httpx>=0.27.0",
    # Sparse retrieval (BM25) — pure Python, zero heavy deps
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Production embeddings — pulls torch+CUDA (~1.5 GB), install only on HF Spaces
prod = [
    "sentence-transformers>=3.0.0",
]
groq = [
    "groq>=0.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nabucodonosor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
